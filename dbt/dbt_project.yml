name: ward_eye
version: '0.1.0'
config-version: 2

profile: ward_eye

model-paths: ["models"]
target-path: "target"
clean-targets: ["target"]

vars:
  # Huso para game_date / week_start. Igual a TIMEZONE en flows/daily_pipeline.py.
  game_timezone: America/Argentina/Buenos_Aires

models:
  ward_eye:
    staging:
      +schema: lol_staging
      +materialized: view
    intermediate:
      +schema: lol_intermediate
      +materialized: table
    marts:
      +schema: lol_marts
      +materialized: table
